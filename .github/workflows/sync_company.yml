name: Sync Team Development To Company

on:
  push:
    branches:
      - development

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Team Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Push to Company Repository
        run: |
          git remote add company https://x-access-token:${{ secrets.COMPANY_PAT }}@github.com/harshal5478/cubeage_DevOps_Demo.git
          git fetch company
          git push company development